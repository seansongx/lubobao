<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>录播宝 · 桌面工作台原型</title>
<style>
:root{color-scheme:light;--bg:#fafafa;--paper:#fff;--ink:#18181b;--muted:#52525b;--line:#e4e4e7;--soft:#f4f4f5;--primary:#18181b;--primary-fg:#fafafa;--hover:#3f3f46;--accent:#e4e4e7;--red:#a92e38;--amber:#855012;--active:#e4e4e7;font:15px/1.55 "Inter","Microsoft YaHei",system-ui,sans-serif}
@media(prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#18181b;--paper:#27272a;--ink:#fafafa;--muted:#a1a1aa;--line:#52525b;--soft:#3f3f46;--active:#3f3f46;--primary:#fafafa;--primary-fg:#18181b;--hover:#d4d4d8;--red:#ffa4a9;--amber:#ffcf86}}
*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--bg)}button,input,select{font:inherit;color:inherit}button,select{cursor:pointer}button{background:none;border:0}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #a1a1aa;outline-offset:2px}button:hover{background:var(--soft)}.app{display:grid;grid-template-columns:210px minmax(0,1fr);min-height:100vh}aside{position:sticky;top:0;height:100vh;border-right:1px solid var(--line);padding:30px 14px 18px;background:var(--paper);display:flex;flex-direction:column}.brand{display:flex;align-items:center;gap:10px;margin:0 12px 40px;font-size:22px;font-weight:750}.mark{height:36px;width:36px;background:var(--primary);border-radius:10px;display:grid;place-items:center;color:var(--primary-fg)}.mark svg{width:24px;height:24px}svg{height:18px;width:18px;vertical-align:middle;flex:none}nav{display:grid;gap:5px}nav button,.navfoot{display:flex;align-items:center;gap:12px;text-align:left;padding:11px 14px;border-radius:7px;font-weight:580}nav .on{background:var(--active);font-weight:700}aside footer{margin-top:auto;border-top:1px solid var(--line);padding-top:15px}.small,small{font-size:13px;color:var(--muted)}.wrap{width:min(1250px,100%);margin:auto;padding:35px clamp(18px,4vw,64px) 44px}.top,.sectionhead,.tools,.summary,.file,.actions,.formfoot,.filters{display:flex;align-items:center;gap:12px}.top,.sectionhead,.file,.formfoot{justify-content:space-between}.top{margin-bottom:24px}h1,h2,h3,p{margin:0}h1{font-size:clamp(25px,3vw,37px);letter-spacing:-.055em;line-height:1.25}h2{font-size:20px;letter-spacing:-.03em}h3{font-size:16px}.sub{color:var(--muted);margin-top:6px;font-size:14px}.btn,.primary{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);border-radius:7px;padding:8px 13px;background:var(--paper);white-space:nowrap}.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-fg);font-weight:650}.primary:hover{background:var(--hover)}
.summary{position:relative;overflow:hidden;background:#18181b;color:white;border-radius:14px;padding:22px 26px;margin-bottom:30px;display:grid;grid-template-columns:1.05fr 1fr 1fr;gap:24px}.summary small{color:#d4d4d8}.metric{display:flex;gap:8px;align-items:baseline}.metric b{font-size:clamp(27px,3.1vw,43px);letter-spacing:-.045em;line-height:1.35;font-variant-numeric:tabular-nums}.metric span{color:#e4e4e7;font-size:13px}.meter{height:4px;background:#52525b;border-radius:6px;margin-top:6px;max-width:210px}.meter i{display:block;width:36%;height:100%;background:var(--accent);border-radius:inherit}.signal{display:flex;align-items:end;height:20px;gap:3px}.signal i{width:4px;background:#d4d4d8;border-radius:2px}.panel{border:1px solid var(--line);background:var(--paper);border-radius:12px;overflow:hidden}.sectionhead{margin-bottom:13px}.tools{justify-content:space-between;padding:12px;flex-wrap:wrap;border-bottom:1px solid var(--line)}.filters{gap:3px;flex-wrap:wrap}.filters button{border-radius:6px;padding:6px 9px;font-size:14px;color:var(--muted)}.filters .on{background:var(--active);color:var(--ink);font-weight:650}.search{display:flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:6px;padding:5px 9px}.search input{width:120px;background:none;border:0;min-width:0}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap;text-align:left}th{font-size:12px;font-weight:550;color:var(--muted);background:var(--bg)}td,th{padding:10px 12px;border-bottom:1px solid var(--line)}td{font-size:14px;height:52px}tbody tr:last-child td{border-bottom:0}tbody tr:hover{background:var(--bg)}input[type=checkbox]{accent-color:var(--primary)}.name{display:inline-flex;align-items:center;gap:10px;font-weight:650;text-align:left;padding:2px;border-radius:5px}.avatar{display:grid;place-items:center;width:31px;height:31px;border-radius:8px;background:var(--soft);color:var(--ink);font-size:14px}.pill{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:13px}.pill:before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}.rec{color:var(--red)}.warn{color:var(--amber)}.num{font-variant-numeric:tabular-nums;font-family:"IBM Plex Mono",ui-monospace,monospace}.icon{width:32px;height:32px;border:1px solid var(--line);border-radius:6px;display:inline-grid;place-items:center}.ops{display:flex;gap:5px}.footnote{border-top:1px solid var(--line);padding:9px 16px;color:var(--muted);font-size:13px}.file{padding:14px 18px;border-bottom:1px solid var(--line);gap:12px}.file:last-child{border:0}.filetext{flex:1;min-width:0;overflow-wrap:anywhere}.fileicon{display:grid;place-items:center;background:var(--soft);height:37px;width:37px;border-radius:8px}.secondary{margin-top:24px}.link{color:var(--muted);text-decoration:underline;text-underline-offset:4px}.empty{padding:28px;text-align:center;color:var(--muted)}.batch{display:flex;gap:10px;align-items:center;padding:8px 14px;background:var(--active)}.form{padding:20px;display:grid;gap:16px;max-width:690px}.field{display:grid;gap:5px;font-size:14px;font-weight:600}.field input,.field select{border:1px solid var(--line);border-radius:7px;padding:9px 10px;background:var(--paper);width:100%}.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}.error{color:var(--red);font-size:14px}.notice{padding:10px 12px;border-radius:7px;background:var(--soft)}dialog{background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:0;width:min(460px,94vw);max-height:93vh}dialog::backdrop{background:#09090b66}dialog .sectionhead{padding:17px 20px;margin:0;border-bottom:1px solid var(--line)}dialog.sheet{margin:0 0 0 auto;height:100%;max-height:100%;border-radius:12px 0 0 12px}#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#27272a;color:white;border-radius:7px;padding:8px 16px;z-index:5}#toast:empty{display:none}.player{width:100%;max-height:260px}.navfoot{font-size:13px;color:var(--muted)}.gap{margin-top:12px}
@media(max-width:1050px){.app{grid-template-columns:155px 1fr}.wrap{padding:25px 18px}.brand{margin-left:4px}aside{padding:24px 8px}.summary{gap:10px;padding:18px}}
@media(max-width:760px){.app{display:block}aside{position:static;height:auto;display:block;padding:10px 14px;border-right:0;border-bottom:1px solid var(--line)}.brand{font-size:18px;display:inline-flex;margin:0 0 8px}.mark{width:28px;height:28px}nav{display:flex;overflow:auto}nav button{padding:6px 9px;white-space:nowrap;gap:5px}aside footer{display:none}.wrap{padding:19px 12px}.summary{padding:14px;gap:9px;margin-bottom:20px}.summary small{font-size:12px}.metric{gap:3px;flex-wrap:wrap}.metric b{font-size:23px}.tools{gap:6px}.pair{grid-template-columns:1fr}.top{gap:8px}.file{padding:10px}.signal{max-width:90px;overflow:hidden}}
</style></head><body>
<div class="app"><aside><div class="brand"><span class="mark" data-icon="wave"></span>录播宝</div><nav aria-label="桌面导航" id="nav"></nav><footer><div class="navfoot"><span data-icon="monitor"></span>本地工作区</div><small style="margin-left:14px">交互原型 · 示例数据</small></footer></aside><main><div class="wrap" id="screen"></div></main></div>
<dialog id="dlg" aria-labelledby="dialog-title"></dialog><div id="toast" role="status"></div>
<script>

'use strict';
const $=s=>document.querySelector(s);
const icons={wave:'M2 12h4l2-7 4 15 3-13 2 5h5',tasks:'M3 5h18v14H3z M3 10h18 M8 10v9',film:'M3 5h18v14H3z M7 5v14 M17 5v14 M3 10h4 M17 14h4',settings:'M3 7h8m4 0h6M3 17h3m4 0h11 M11 4v6 M7 14v6',log:'M4 4h16v16H4z M8 9h8 M8 14h6',monitor:'M3 4h18v13H3z M9 21h6 M12 17v4',plus:'M12 5v14 M5 12h14',search:'M15 15l6 6 M17 10a7 7 0 1 1-14 0 7 7 0 1 1 14 0',edit:'M4 16l11-11 4 4L8 20H4z',pause:'M8 5v14 M16 5v14',play:'M7 4l13 8-13 8z',retry:'M4 11a8 8 0 1 1 1 6 M4 5v6h6',close:'M5 5l14 14 M19 5L5 19',file:'M5 3h9l5 5v13H5z M14 3v6h5',folder:'M3 6h7l2 3h9v11H3z'};
const icon=k=>`<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="${icons[k]}"/></svg>`;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
document.querySelectorAll('[data-icon]').forEach(el=>el.innerHTML=icon(el.dataset.icon));
const pages={tasks:'录制工作台',film:'录像文件',log:'活动日志',settings:'偏好设置'};
const statuses={rec:'录制中',wait:'等待开播',warn:'需处理',off:'已暂停'};
const names=['山野电台','深夜爵士室','阿澄的厨房','城市散步计划','松果游戏社','海岸观察站'];
let defaults={quality:'原画',format:'TS',folder:'D:/Recordings',interval:180};
let tasks=names.map((name,i)=>({id:i+1,name,platform:i%3===1?'快手':'抖音',url:i%3===1?'https://live.kuaishou.com/u/demo'+i:'https://live.douyin.com/10000'+i,status:['rec','rec','wait','warn','wait','off'][i],quality:'原画',format:'TS',duration:['01:24:18','00:36:52'][i]||'—'}));
let files=[{name:'山野电台_山间晨读.ts',time:'今天 09:32',size:'1.26 GB',duration:'00:48:12'},{name:'深夜爵士室_周末即兴.ts',time:'昨天 23:16',size:'2.08 GB',duration:'01:12:40'}];
let logs=[{time:'10:48',text:'城市散步计划 · 平台响应超时，等待重试'},{time:'10:31',text:'深夜爵士室 · 检测到开播，开始录制'}];
let page='tasks',filter='all',query='',nextId=7,selected=new Set(),toastTimer;
const time=()=>new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});
const notice=text=>{ $('#toast').textContent=text;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').textContent='',2400);};
const shown=()=>tasks.filter(t=>(filter==='all'||t.status===filter)&&(t.name+t.platform).toLowerCase().includes(query.toLowerCase()));
function nav(){ $('#nav').innerHTML=Object.entries(pages).map(([id,label])=>`<button data-page="${id}" ${id===page?'class="on" aria-current="page"':''}>${icon(id)}${label}</button>`).join('');}
function title(sub,action=''){return `<div class="top"><div><h1>${pages[page]}</h1><p class="sub">${sub}</p></div>${action}</div>`;}
function summary(){const live=tasks.filter(t=>t.status==='rec').length;
return `<div class="summary" aria-label="工作区概况（模拟数据）"><div><small>当前录制</small><div class="metric"><b>${live}</b><span>个直播间</span></div><div class="signal" aria-hidden="true">${[5,9,7,14,11,18,12,6,15,10,16,19,8,12,6,17,13,10,5,14,9,12,6,10].map(h=>`<i style="height:${live?h:2}px"></i>`).join('')}</div></div><div><small>本次写入速率</small><div class="metric"><b>${(live*2.4).toFixed(1)}</b><span>MB/s</span></div></div><div><small>磁盘可用空间</small><div class="metric"><b>328</b><span>/ 512 GB</span></div><div class="meter" title="已用 36%"><i></i></div></div></div>`;}
function fileRows(items){return items.map(f=>`<div class="file"><span class="fileicon">${icon('file')}</span><div class="filetext"><b>${esc(f.name)}</b><div class="small">${esc(f.time)} · ${esc(f.size)} · ${esc(f.duration)}</div></div><button class="btn" data-file="${files.indexOf(f)}">查看</button></div>`).join('')||'<p class="empty">尚无录像文件</p>';}
function taskTable(){const visible=shown();return `${selected.size?`<div class="batch">已选 ${selected.size} 项 <button class="btn" data-batch="start">启用监控</button><button class="btn" data-batch="stop">暂停监控</button></div>`:''}<div class="scroll"><table><thead><tr><th><input type="checkbox" id="all" aria-label="选择当前列表" ${visible.length&&visible.every(t=>selected.has(t.id))?'checked':''}></th><th>直播间</th><th>平台</th><th>任务状态</th><th>已录时长</th><th>操作</th></tr></thead><tbody>${visible.map(t=>`<tr><td><input type="checkbox" aria-label="选择 ${esc(t.name)}" data-select="${t.id}" ${selected.has(t.id)?'checked':''}></td><td><button class="name" data-edit="${t.id}"><span class="avatar">${esc(t.name.slice(0,1))}</span>${esc(t.name)}</button></td><td>${t.platform}</td><td><span class="pill ${t.status}">${statuses[t.status]}</span></td><td class="num">${t.duration}</td><td><div class="ops">${op(t)}<button class="icon" aria-label="编辑 ${esc(t.name)}" title="任务详情" data-edit="${t.id}">${icon('edit')}</button></div></td></tr>`).join('')}</tbody></table>${visible.length?'':'<p class="empty">没有匹配的任务，可调整筛选或添加直播间。</p>'}</div><div class="footnote">显示 ${visible.length} / ${tasks.length} 个任务</div>`;}
function op(t){const [label,k]=t.status==='warn'?['重试','retry']:t.status==='off'?['启用监控','play']:['暂停监控','pause'];return `<button class="icon" title="${label}" aria-label="${label} ${esc(t.name)}" data-toggle="${t.id}">${icon(k)}</button>`;}
function field(label,id,value,type='text'){return `<label class="field">${label}<input id="${id}" type="${type}" value="${esc(value)}" required></label>`;}
function pick(label,id,val,list){return `<label class="field">${label}<select id="${id}">${list.map(v=>`<option ${val===v?'selected':''}>${v}</option>`).join('')}</select></label>`;}
function render(){nav();let html;
if(page==='tasks'){html=title('监控直播间、处理异常和管理录制任务。',`<button class="primary" data-new>${icon('plus')}添加直播间</button>`)+summary()+`<div class="sectionhead"><h2>直播间任务</h2><small>示例工作区</small></div><section class="panel"><div class="tools"><div class="filters">${[['all','全部'],['rec','录制中'],['wait','等待开播'],['warn','需处理'],['off','已暂停']].map(([v,l])=>`<button class="${filter===v?'on':''}" aria-pressed="${filter===v}" data-filter="${v}">${l} ${v==='all'?tasks.length:tasks.filter(t=>t.status===v).length}</button>`).join('')}</div><label class="search">${icon('search')}<input id="q" type="search" placeholder="搜索主播或平台" aria-label="搜索主播或平台" value="${esc(query)}"></label></div><div id="rows">${taskTable()}</div></section><div class="secondary sectionhead"><h2>最近录像</h2><button class="link" data-page="film">全部文件</button></div><section class="panel">${fileRows(files.slice(0,2))}</section>`;}
if(page==='film')html=title('浏览已保存的录像，查看文件信息和播放预览。')+`<div class="sectionhead"><h2>${icon('folder')} 录像目录</h2><small>${files.length} 个示例文件</small></div><section class="panel">${fileRows(files)}</section>`;
if(page==='log')html=title('按时间查看任务变更和录制异常。')+`<section class="panel">${logs.map(l=>`<div class="file"><span class="small num">${esc(l.time)}</span><div class="filetext">${esc(l.text)}</div></div>`).join('')}</section>`;
if(page==='settings')html=title('设置新任务的录制默认值。')+`<form class="panel form" id="prefs">${field('录像保存目录','folder',defaults.folder)}<div class="pair">${pick('默认画质','quality',defaults.quality,['原画','高清','标清'])}${pick('输出格式','format',defaults.format,['TS','MP4','MKV'])}</div>${field('监控间隔（秒）','interval',defaults.interval,'number')}<div><button class="primary">保存设置</button></div><small>变更仅在本次原型会话中生效。</small></form>`;
$('#screen').innerHTML=html;if($('#interval'))$('#interval').min='1';}
function dialog(title,content,sheet=false){const d=$('#dlg');d.className=sheet?'sheet':'';d.innerHTML=`<div class="sectionhead"><h2 id="dialog-title">${title}</h2><button class="icon" data-close aria-label="关闭">${icon('close')}</button></div>${content}`;if(!d.open)d.showModal();}
function taskDialog(t){dialog(t?'任务详情':'添加直播间',`<form class="form" id="taskform" data-id="${t?.id||''}">${t?`<p class="notice"><span class="pill ${t.status}">${statuses[t.status]}</span>　${t.status==='warn'?'平台响应超时，可返回列表重试。':esc(t.platform)}</p>`:''}${field('直播间链接','url',t?.url||'','url')}${field('任务名称','taskname',t?.name||'')}<div class="pair">${pick('录制画质','quality',t?.quality||defaults.quality,['原画','高清','标清'])}${pick('保存格式','format',t?.format||defaults.format,['TS','MP4','MKV'])}</div><p class="small">可使用抖音或快手直播间链接。此预览仅模拟监控操作。</p><p id="formerror" class="error" role="alert"></p><div class="formfoot"><button type="button" class="btn" data-close>取消</button><button class="primary">${t?'保存修改':'添加并监控'}</button></div></form>`,!!t);}
function change(t,action){const before=t.status;const next=action==='stop'?'off':'wait';if(before===next||(action==='start'&&before==='rec'))return;
if(before==='rec'&&next==='off'){files.unshift({name:t.name+'_'+time().replace(':','-')+'.'+t.format.toLowerCase(),size:'模拟文件',time:'今天 '+time(),duration:t.duration});t.duration='—';}
t.status=next;logs.unshift({time:time(),text:t.name+' · '+(next==='off'?'监控已暂停':before==='warn'?'模拟重试成功，等待开播':'监控已启用')});}
let videoUrl;
$('#dlg').addEventListener('close',()=>{if(videoUrl){URL.revokeObjectURL(videoUrl);videoUrl=null;}$('#dlg').replaceChildren();});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
if(d.page){page=d.page;selected.clear();render();}
if('new'in d)taskDialog();
if('close'in d)$('#dlg').close();
if(d.edit)taskDialog(tasks.find(t=>t.id===+d.edit));
if(d.filter){filter=d.filter;selected.clear();render();}
if(d.toggle){const t=tasks.find(t=>t.id===+d.toggle);change(t,['warn','off'].includes(t.status)?'start':'stop');notice(logs[0].text);render();}
if(d.batch){tasks.filter(t=>selected.has(t.id)).forEach(t=>change(t,d.batch));selected.clear();render();notice('已更新所选任务');}
if('file'in d){const f=files[+d.file];dialog('录像详情',`<div class="form"><h3>${esc(f.name)}</h3><p class="small">${esc(f.time)} · ${esc(f.duration)} · ${esc(f.size)}</p><p>示例记录没有附带视频。选择本机视频即可在此试播。</p><label class="field">选择本地视频<input id="localfile" type="file" accept="video/*"></label><video class="player" id="video" controls hidden></video></div>`,true);}
});
document.addEventListener('input',e=>{if(e.target.id==='q'){query=e.target.value;selected.clear();$('#rows').innerHTML=taskTable();}});
document.addEventListener('change',e=>{const el=e.target;if(el.id==='all'){shown().forEach(t=>el.checked?selected.add(t.id):selected.delete(t.id));$('#rows').innerHTML=taskTable();}
if(el.dataset.select){el.checked?selected.add(+el.dataset.select):selected.delete(+el.dataset.select);$('#rows').innerHTML=taskTable();}
if(el.id==='localfile'&&el.files[0]){if(videoUrl)URL.revokeObjectURL(videoUrl);videoUrl=URL.createObjectURL(el.files[0]);$('#video').src=videoUrl;$('#video').hidden=false;}});
document.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='prefs'){defaults={quality:$('#quality').value,format:$('#format').value,folder:$('#folder').value,interval:Number($('#interval').value)};notice('已保存本次会话的默认设置');return;}
if(e.target.id!=='taskform')return;const id=+e.target.dataset.id;const u=new URL($('#url').value);const host=u.hostname;const platform=/(^|\.)douyin\.com$/.test(host)?'抖音':/(^|\.)kuaishou\.com$/.test(host)?'快手':'';const name=$('#taskname').value.trim();
if(!['https:','http:'].includes(u.protocol)||!platform||!name){$('#formerror').textContent='请填写任务名称和有效的抖音或快手直播间链接。';return;}
const url=u.href;if(tasks.some(t=>t.id!==id&&t.url===url)){$('#formerror').textContent='该直播间已在任务列表中。';return;}
const values={name,url,platform,quality:$('#quality').value,format:$('#format').value};
if(id)Object.assign(tasks.find(t=>t.id===id),values);else{tasks.unshift({...values,id:nextId++,status:'wait',duration:'—'});filter='all';query='';selected.clear();}
logs.unshift({time:time(),text:name+' · '+(id?'已修改任务':'已添加监控')});$('#dlg').close();render();notice(id?'已保存任务':'已添加，等待开播');});
render();

</script></body></html>

<!doctype html>
<html lang="zh-CN" data-platform="windows" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>录播宝 · 原生界面原型</title>
<!--
  原生界面原型：内容区三个平台统一（原 macOS 的样子），只有窗口外壳随平台（Windows 11 / macOS / Linux）× 浅色 / 深色。
  说明见 docs/design/native-ui.md。参数：?platform=windows|macos|linux&theme=light|dark&page=rooms|library|settings&dialog=add&ui=0
  Mica 与毛玻璃无法在网页里真实绘制，这里用模糊渐变近似；窗口外框、标题栏和红绿灯为示意，真实应用由系统绘制。

  2026-11-23 决定：控件（按钮、输入框、开关、复选框、对话框、菜单等）改用 shadcn/ui Nova 默认样式。本原型里的控件外形
  是当初的探索，以应用实际效果为准。同日决定内容区三个平台统一：切换平台只改变字体族、窗口材质与底色、标题栏、
  红绿灯位置、滚动条和快捷键写法。对话框主按钮三个平台都在左，「添加直播间」是带文字的 Teal 按钮。
-->
<style>
/* ================= 平台与主题 token ================= */
:root {
  /* 共用：品牌与状态色（AGENTS.md） */
  --primary: #0f766e; --primary-hover: #115e59; --primary-fg: #fff;
  --primary-soft: rgb(15 118 110 / .10);
  --status-recording: #dc2626; --status-waiting: #94a3b8; --status-checking: #2563eb;
  --status-retrying: #b45309; --status-notify: var(--primary);
  --status-recording-soft: rgb(220 38 38 / .07);
  --ease: cubic-bezier(0, 0, 0, 1); --dur: 200ms;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --primary: #2dd4bf; --primary-hover: #5eead4; --primary-fg: #042f2e;
  --primary-soft: rgb(45 212 191 / .13);
  --status-recording: #f87171; --status-waiting: #64748b; --status-checking: #60a5fa;
  --status-retrying: #fbbf24; --status-recording-soft: rgb(248 113 113 / .10);
}

/* ---------- 内容区：三个平台共用（原 macOS 的值） ---------- */
:root {
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", "Microsoft YaHei UI", sans-serif;
  --fs: 13px; --fs-table: 13px; --fs-small: 11px; --fs-title: 15px; --fw-title: 700;
  --ctl-h: 24px; --nav-h: 36px; --pad: 20px; --sidebar-w: 216px;
  --r-ctl: 6px; --r-card: 10px; --r-dialog: 12px; --r-menu: 7px; --r-sel: 6px;
  --menu-item-h: 22px;
  --wallpaper: radial-gradient(60% 80% at 10% 20%, #b9cfe6 0, transparent 70%), radial-gradient(60% 70% at 30% 90%, #d6c9e2 0, transparent 70%), #dfe3ea;
  --window-tint: transparent;
  --sidebar-bg: rgb(232 232 237 / .62);
  --content-bg: #ffffff; --content-border: rgb(0 0 0 / .10);
  --fg: rgb(0 0 0 / .85); --fg2: rgb(0 0 0 / .50); --fg3: rgb(0 0 0 / .26);
  --divider: rgb(0 0 0 / .09);
  --hover: rgb(0 0 0 / .05); --pressed: rgb(0 0 0 / .08);
  --card-bg: rgb(0 0 0 / .025); --card-border: rgb(0 0 0 / .07);
  --ctl-bg: #fff; --ctl-border: rgb(0 0 0 / .12); --ctl-border-bottom: rgb(0 0 0 / .20);
  --ctl-hover: #fff;
  --input-bg: #fff; --input-border-bottom: rgb(0 0 0 / .14);
  --popover-bg: rgb(246 246 246 / .92); --popover-border: rgb(0 0 0 / .14);
  --shadow-popover: 0 10px 30px rgb(0 0 0 / .18);
  --shadow-dialog: 0 0 0 .5px rgb(0 0 0 / .2), 0 22px 60px rgb(0 0 0 / .30);
  --scrim: rgb(0 0 0 / .10);
  --sel-bg: var(--primary-soft);
  --statusbar-bg: #f6f6f6;
  --dialog-footer-bg: transparent;
  --ease: ease-out; --dur: 200ms;
}
:root[data-theme="dark"] {
  --wallpaper: radial-gradient(60% 80% at 10% 20%, #23344d 0, transparent 70%), radial-gradient(60% 70% at 30% 90%, #3a2c48 0, transparent 70%), #17191d;
  --sidebar-bg: rgb(44 44 48 / .58);
  --content-bg: #1e1e1e; --content-border: rgb(0 0 0 / .6);
  --fg: rgb(255 255 255 / .85); --fg2: rgb(255 255 255 / .55); --fg3: rgb(255 255 255 / .25);
  --divider: rgb(255 255 255 / .10);
  --hover: rgb(255 255 255 / .06); --pressed: rgb(255 255 255 / .1);
  --card-bg: rgb(255 255 255 / .04); --card-border: rgb(255 255 255 / .07);
  --ctl-bg: rgb(255 255 255 / .14); --ctl-border: rgb(255 255 255 / .06); --ctl-border-bottom: rgb(255 255 255 / .02);
  --ctl-hover: rgb(255 255 255 / .18);
  --input-bg: rgb(255 255 255 / .06); --input-border-bottom: rgb(255 255 255 / .12);
  --popover-bg: rgb(40 40 42 / .94); --popover-border: rgb(255 255 255 / .12);
  --shadow-popover: 0 10px 30px rgb(0 0 0 / .45);
  --shadow-dialog: 0 0 0 .5px rgb(255 255 255 / .12), 0 22px 60px rgb(0 0 0 / .55);
  --statusbar-bg: #252525;
  --scrim: rgb(0 0 0 / .2);
}

/* ---------- 外壳：只有字体族、窗口材质与底色随平台 ---------- */
[data-platform="windows"] {
  --font: "Segoe UI Variable Text", "Segoe UI Variable", "Segoe UI", "Microsoft YaHei UI", sans-serif;
  /* Mica：窗口底、侧栏和状态栏透明，内容层半透明 */
  --wallpaper: radial-gradient(60% 80% at 15% 10%, #c7d6e8 0, transparent 70%), radial-gradient(70% 70% at 90% 80%, #d9e4dc 0, transparent 70%), #e6e9ee;
  --window-tint: rgb(236 236 236 / .80);
  --sidebar-bg: transparent;
  --content-bg: rgb(255 255 255 / .50);
  --statusbar-bg: transparent;
}
[data-platform="windows"][data-theme="dark"] {
  --wallpaper: radial-gradient(60% 80% at 15% 10%, #26324a 0, transparent 70%), radial-gradient(70% 70% at 90% 80%, #1f3330 0, transparent 70%), #1b1d22;
  --window-tint: rgb(43 43 45 / .82);
  --sidebar-bg: transparent; --statusbar-bg: transparent;
  --content-bg: rgb(58 58 58 / .30);
}
[data-platform="linux"] {
  --font: "Adwaita Sans", Cantarell, "Noto Sans CJK SC", "Ubuntu", "Microsoft YaHei UI", system-ui, sans-serif;
  /* 没有窗口材质：不透明底色 */
  --wallpaper: #ececec; --window-tint: #ececec;
  --sidebar-bg: transparent; /* 侧栏与窗口同底 */
}
[data-platform="linux"][data-theme="dark"] {
  --wallpaper: #2b2b2d; --window-tint: #2b2b2d;
  --sidebar-bg: transparent;
}

/* ================= 基础与去网页感 ================= */
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  font: var(--fs)/1.43 var(--font);
  color: var(--fg);
  background: var(--wallpaper);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
  user-select: none; -webkit-user-select: none;   /* 界面框架不可选中 */
  cursor: default;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
}
.selectable, input, textarea { user-select: text; -webkit-user-select: text; cursor: text; }
.selectable { cursor: auto; }
img, a { -webkit-user-drag: none; }
button, input, select { font: inherit; color: inherit; }
button { cursor: default; }
a.link { color: var(--primary); text-decoration: none; cursor: pointer; }
a.link:hover { text-decoration: underline; }
:focus { outline: none; }
.num { font-variant-numeric: tabular-nums; }
.fg2 { color: var(--fg2); }
svg.i { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
svg.i { width: 15px; height: 15px; stroke-width: 1.7; }

/* 焦点环：只在键盘操作时显示，三个平台相同 */
:focus-visible { outline: 2px solid var(--primary); outline-offset: 1px; }
:focus-visible { outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 50%, transparent) !important; }

/* 滚动条 */
[data-platform="windows"] ::-webkit-scrollbar { width: 12px; height: 12px; }
[data-platform="windows"] ::-webkit-scrollbar-track { background: transparent; }
[data-platform="windows"] ::-webkit-scrollbar-thumb { background: var(--fg3); border-radius: 6px; border: 5px solid transparent; background-clip: content-box; }
[data-platform="windows"] .scroll:hover::-webkit-scrollbar-thumb { border-width: 3px; }
[data-platform="linux"] ::-webkit-scrollbar { width: 12px; height: 12px; }
[data-platform="linux"] ::-webkit-scrollbar-thumb { background: var(--fg3); border-radius: 6px; border: 4px solid transparent; background-clip: content-box; }
[data-platform="linux"] .scroll:hover::-webkit-scrollbar-thumb { border-width: 2px; }
[data-platform="macos"] ::-webkit-scrollbar { width: 10px; }
[data-platform="macos"] ::-webkit-scrollbar-thumb { background: transparent; border-radius: 5px; border: 2px solid transparent; background-clip: content-box; }
[data-platform="macos"] .scroll:hover::-webkit-scrollbar-thumb { background-color: rgb(127 127 127 / .5); }

@media (prefers-reduced-motion: reduce) { * { animation-duration: 0s !important; transition-duration: 0s !important; } }

/* ================= 窗口 ================= */
.window { position: fixed; inset: 0; display: flex; flex-direction: column; background: var(--window-tint); overflow: hidden; }
.titlebar { display: none; }
[data-platform="windows"] .titlebar { display: flex; height: 32px; align-items: center; padding-left: 12px; gap: 10px; font-size: 12px; }
[data-platform="windows"] .titlebar .appicon { width: 16px; height: 16px; border-radius: 4px; background: var(--primary); display: grid; place-items: center; }
[data-platform="windows"] .titlebar .appicon::after { content: ""; width: 6px; height: 6px; border-radius: 50%; border: 1.5px solid var(--primary-fg); }
[data-platform="windows"] .titlebar .caps { margin-left: auto; display: flex; height: 100%; }
[data-platform="windows"] .titlebar .caps span { width: 46px; display: grid; place-items: center; color: var(--fg); }
[data-platform="windows"] .titlebar .caps span:hover { background: var(--hover); }
[data-platform="windows"] .titlebar .caps span.close:hover { background: #c42b1c; color: #fff; }
[data-platform="windows"] .titlebar .caps svg { width: 10px; height: 10px; stroke-width: 1; }
[data-platform="linux"] .titlebar { display: flex; height: 46px; align-items: center; justify-content: center; position: relative; background: var(--sidebar-bg); border-bottom: 1px solid var(--divider); font-weight: 700; font-size: 14px; }
[data-platform="linux"][data-theme="light"] .titlebar { background: #ffffff; }
[data-platform="linux"][data-theme="dark"] .titlebar { background: #303030; }
[data-platform="linux"] .titlebar .caps { position: absolute; right: 10px; display: flex; gap: 12px; }
[data-platform="linux"] .titlebar .caps span { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: var(--ctl-bg); }
[data-platform="linux"] .titlebar .caps span:not(.close) { display: none; }
[data-platform="linux"] .titlebar .caps svg { width: 10px; height: 10px; stroke-width: 1.8; }
[data-platform="linux"] .titlebar .appicon, [data-platform="linux"] .titlebar .apptitle-left { display: none; }
[data-platform="linux"] .titlebar .apptitle-center { display: inline !important; }

.shell { flex: 1; display: grid; grid-template-columns: var(--sidebar-w) 1fr; min-height: 0; }
.sidebar { background: var(--sidebar-bg); display: flex; flex-direction: column; padding: 4px 8px 8px; gap: 2px; min-height: 0; }
.sidebar { padding: 4px 6px 8px; position: relative; } /* 原 Windows 的样子：与窗口同底，不画分隔线 */
/* 外壳：macOS 侧栏透出 vibrancy，顶部给红绿灯留出工具栏高度 */
[data-platform="macos"] .sidebar { padding-top: 52px; backdrop-filter: blur(30px) saturate(1.6); -webkit-backdrop-filter: blur(30px) saturate(1.6); }
.traffic { display: none; }
[data-platform="macos"] .traffic { display: flex; gap: 8px; position: absolute; left: 18px; top: 18px; }
.traffic i { width: 12px; height: 12px; border-radius: 50%; display: block; box-shadow: inset 0 0 0 .5px rgb(0 0 0 / .15); }
.traffic i:nth-child(1) { background: #ff5f57; } .traffic i:nth-child(2) { background: #febc2e; } .traffic i:nth-child(3) { background: #28c840; }

.nav { position: relative; display: flex; align-items: center; gap: 12px; height: var(--nav-h); padding: 0 12px; border: 0; border-radius: var(--r-ctl); background: transparent; text-align: left; color: var(--fg); font-size: 14px; }
.nav:hover { background: var(--hover); }
.nav.on { background: var(--hover); }
.nav.on { background: rgb(0 0 0 / .05); }
:root[data-theme="dark"] .nav.on { background: rgb(255 255 255 / .06); }
.sidebar .nav.on::before { content: ""; position: absolute; left: 0; top: 50%; width: 3px; height: 16px; translate: 0 -50%; border-radius: 99px; background: var(--primary); }
.nav-head { font-size: 11px; font-weight: 600; color: var(--fg3); padding: 0 8px 4px; }
.nav-head { display: none; }
.nav .count { margin-left: auto; font-size: var(--fs-small); color: var(--fg2); }
.nav .count.rec { color: var(--status-recording); display: inline-flex; align-items: center; gap: 5px; }
.nav .count.rec::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

.main { display: grid; grid-template-rows: 1fr auto; min-width: 0; min-height: 0; }
.layer { background: var(--content-bg); min-width: 0; min-height: 0; display: flex; }
.page { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }

/* 页头 / 工具栏 */
.head { display: flex; align-items: center; gap: 8px; padding: 18px var(--pad) 0; }
.head h1 { margin: 0; font-size: var(--fs-title); font-weight: var(--fw-title); }
.head .sub { color: var(--fg2); font-size: var(--fs-small); margin-left: 6px; }
.head .spacer { flex: 1; }
.head { height: 52px; padding: 0 14px 0 var(--pad); border-bottom: 1px solid var(--divider); }
.head .sub { font-size: 11px; display: block; margin: 0; }

.cmdbar { display: flex; align-items: center; gap: 8px; padding: 14px var(--pad) 10px; flex-wrap: wrap; }
.cmdbar { padding: 10px var(--pad) 8px; }

/* 按钮 */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: var(--ctl-h); padding: 0 12px; border-radius: var(--r-ctl); white-space: nowrap; border: 1px solid var(--ctl-border); border-bottom-color: var(--ctl-border-bottom); background: var(--ctl-bg); color: var(--fg); transition: background var(--dur) var(--ease); }
.btn:hover { background: var(--ctl-hover); }
.btn:active { background: var(--pressed); color: var(--fg2); }
.btn.primary { background: var(--primary); border-color: rgb(255 255 255 / .08); border-bottom-color: rgb(0 0 0 / .4); color: var(--primary-fg); }
[data-theme="dark"] .btn.primary { border-color: transparent; border-bottom-color: rgb(0 0 0 / .14); }
.btn.primary:hover { background: color-mix(in srgb, var(--primary) 90%, var(--content-bg)); }
.btn.subtle { background: transparent; border-color: transparent; }
.btn.subtle:hover { background: var(--hover); }
.btn.subtle:disabled { color: var(--fg3); background: transparent; }
.btn .danger { color: var(--status-recording); }
.btn.icon { width: var(--ctl-h); padding: 0; }
.btn { padding: 0 10px; box-shadow: 0 .5px 1.5px rgb(0 0 0 / .12); border: .5px solid var(--ctl-border); }
.btn.primary { box-shadow: inset 0 .5px 0 rgb(255 255 255 / .25), 0 .5px 1.5px rgb(0 0 0 / .2); background: linear-gradient(var(--primary-hover), var(--primary)); border-color: transparent; }
:root[data-theme="dark"] .btn.primary { background: var(--primary); }
.btn.subtle, .btn.tb { box-shadow: none; border-color: transparent; background: transparent; height: 28px; }
.btn.tb { color: var(--fg2); padding: 0 6px; }
.btn.tb svg.i { width: 17px; height: 17px; }
.btn.tb:hover, .btn.subtle:hover { background: var(--hover); }
.head .btn.tb { display: none; }

/* 输入 */
.field { display: inline-flex; align-items: center; gap: 6px; height: var(--ctl-h); padding: 0 10px; border-radius: var(--r-ctl); background: var(--input-bg); border: 1px solid var(--ctl-border); border-bottom-color: var(--input-border-bottom); color: var(--fg2); min-width: 0; }
.field input { border: 0; outline: 0; background: transparent; min-width: 0; flex: 1; color: var(--fg); padding: 0; }
.field input:focus-visible { outline: none; box-shadow: none !important; }
.field input::placeholder { color: var(--fg2); }
.field:focus-within { border-bottom: 2px solid var(--primary); }
.field { border: .5px solid var(--ctl-border); box-shadow: inset 0 .5px 1px rgb(0 0 0 / .06); }
.field:focus-within { border-bottom: .5px solid var(--ctl-border); box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 45%, transparent); }
.field.search { border-radius: 7px; height: 28px; background: rgb(0 0 0 / .05); border-color: transparent; box-shadow: none; }
:root[data-theme="dark"] .field.search { background: rgb(255 255 255 / .08); }
.search { width: 220px; }
.select { justify-content: space-between; color: var(--fg); min-width: 96px; }
.select svg { color: var(--fg2); width: 12px; height: 12px; }

/* 分段筛选 */
.seg { display: inline-flex; gap: 2px; padding: 0; }
.seg button { display: inline-flex; align-items: center; gap: 6px; height: calc(var(--ctl-h) - 2px); padding: 0 10px; border: 0; border-radius: var(--r-ctl); background: transparent; color: var(--fg2); white-space: nowrap; position: relative; }
.seg button b { font-weight: 600; color: var(--fg); font-variant-numeric: tabular-nums; }
.seg button:hover { background: var(--hover); }
.seg button.on { color: var(--fg); background: var(--hover); }
.seg { background: rgb(0 0 0 / .06); border-radius: 7px; padding: 2px; }
:root[data-theme="dark"] .seg { background: rgb(255 255 255 / .07); }
.seg button { height: 20px; padding: 0 9px; border-radius: 5px; font-size: 12px; }
.seg button.on { background: var(--ctl-bg); box-shadow: 0 .5px 2px rgb(0 0 0 / .18); }
:root[data-theme="dark"] .seg button.on { background: rgb(255 255 255 / .2); }
.seg .sdot { width: 7px; height: 7px; border-radius: 50%; }
.cmdbar .count-label { margin-left: auto; color: var(--fg2); font-size: var(--fs-small); }

/* ================= 任务表 ================= */
.rooms { flex: 1; display: flex; min-height: 0; min-width: 0; }
.rooms-main { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.tablewrap { flex: 1; overflow: auto; min-height: 0; padding: 0 calc(var(--pad) - 12px) 8px; }
table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: var(--fs-table); }
th { position: sticky; top: 0; z-index: 1; text-align: left; font-weight: 400; color: var(--fg2); font-size: var(--fs-small); height: 32px; padding: 0 10px; white-space: nowrap; border-bottom: 1px solid var(--divider); background: var(--th-bg, transparent); }
th { --th-bg: var(--content-bg); font-weight: 500; height: 28px; font-size: 12px; }
th .sort { opacity: .6; margin-left: 2px; width: 11px; height: 11px; vertical-align: -1px; }
td { padding: 0 10px; white-space: nowrap; }
table:not(.tasks) td { height: 44px; }
tbody td:first-child { border-radius: var(--r-sel) 0 0 var(--r-sel); }
tbody td:last-child { border-radius: 0 var(--r-sel) var(--r-sel) 0; }
tbody tr:hover td { background: var(--hover); }
tbody tr.sel td { background: var(--sel-bg); }
/* 任务表与应用里的 shadcn Table 默认样式一致：表头 40px、单元格 8px 内边距、行高由内容决定、行间分隔线；
   悬停和选中用中性灰底，不加状态底色、透明度和选中竖条。 */
table.tasks th { height: 40px; padding: 0 8px; font-weight: 500; color: var(--fg); }
table.tasks td { padding: 8px; }
table.tasks tbody td { border-radius: 0 !important; box-shadow: none !important; border-bottom: 1px solid var(--divider); }
table.tasks tbody tr:last-child td { border-bottom: 0; }
table.tasks tbody tr:hover td { background: color-mix(in srgb, var(--fg) 4%, transparent); }
table.tasks tbody tr.sel td { background: color-mix(in srgb, var(--fg) 8%, transparent); }
.cb { appearance: none; width: 16px; height: 16px; margin: 0; border-radius: 4px; border: 1px solid var(--fg3); background: var(--input-bg); display: grid; place-items: center; vertical-align: middle; }
.cb:checked { background: var(--primary); border-color: var(--primary); }
.cb:checked::after { content: ""; width: 8px; height: 4px; border: 1.6px solid var(--primary-fg); border-top: 0; border-right: 0; transform: rotate(-45deg) translate(1px, -1px); }
.cb { width: 14px; height: 14px; border-radius: 3.5px; border: .5px solid rgb(0 0 0 / .25); box-shadow: 0 .5px 1px rgb(0 0 0 / .1); }
.who { display: flex; align-items: center; gap: 10px; }
.avatar { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 600; flex: none; color: var(--fg); background: var(--hover); box-shadow: inset 0 0 0 1px var(--divider); }
.who .name { line-height: 1.25; }
.who .meta { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--fg2); line-height: 1.3; }
.tag { font-size: 10.5px; padding: 0 4px; border-radius: 3px; box-shadow: inset 0 0 0 1px var(--divider); color: var(--fg2); }
.col-opt { }
@media (max-width: 1200px) { .col-opt { display: none; } .search { width: 170px; } }

/* 状态 */
.st { display: inline-flex; align-items: center; gap: 7px; }
.st .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
.st.recording { color: var(--status-recording); font-weight: 600; }
.st.recording .dot { background: var(--status-recording); animation: pulse 1.6s ease-in-out infinite; }
.st.waiting { color: var(--fg2); }
.st.waiting .dot { border: 2px solid var(--status-waiting); }
.st.checking { color: var(--status-checking); }
.st.checking .dot { border: 2px solid var(--status-checking); border-right-color: transparent; animation: spin .9s linear infinite; }

  return `

function render() {
  const layer = $("#layer");
  layer.innerHTML = { rooms: roomsPage, library: libraryPage, settings: settingsPage, activity: activityPage }[state.page]();
  document.querySelectorAll(".nav[data-page]").forEach((b) => b.classList.toggle("on", b.dataset.page === state.page));
  document.querySelectorAll(".proto [data-set]").forEach((b) => {
    const cur = b.dataset.set === "page" ? state.page : document.documentElement.dataset[b.dataset.set];
    b.classList.toggle("on", cur === b.dataset.v);
  });
  if ($("#scrim").classList.contains("open")) $("#scrim").innerHTML = addDialog();
}

function openDialog() { const s = $("#scrim"); s.innerHTML = addDialog(); s.classList.add("open"); setTimeout(() => $("#url")?.focus(), 0); }
function closeDialog() { $("#scrim").classList.remove("open"); }

// ---------- 交互 ----------
document.addEventListener("click", (e) => {
  hideCtx();
  const nav = e.target.closest(".nav[data-page]"); if (nav) { state.page = nav.dataset.page; render(); return; }
  const set = e.target.closest(".proto [data-set]");
  if (set) { if (set.dataset.set === "page") state.page = set.dataset.v; else document.documentElement.dataset[set.dataset.set] = set.dataset.v; render(); return; }
  if (e.target.closest("#open-add") || e.target.closest("[data-act=add]") || e.target.closest(".btn.tb")) { openDialog(); return; }
  if (e.target.closest("[data-act=close-dlg]") || e.target === $("#scrim")) { closeDialog(); return; }
  if (e.target.closest("[data-act=close-insp]")) { state.selected = -1; render(); return; }
  const f = e.target.closest("[data-filter]"); if (f) { state.filter = f.dataset.filter; render(); return; }
  const tr = e.target.closest("table.tasks tbody tr"); if (tr && !e.target.closest(".cb")) { state.selected = +tr.dataset.i; render(); return; }
  const sw = e.target.closest(".sw"); if (sw) { sw.classList.toggle("on"); return; }
});

// 屏蔽浏览器右键菜单；输入框保留；任务行和录像条目显示应用菜单；可选文字有选区时只给「复制」
const ctx = $("#ctx");
function showCtx(x, y, html) { ctx.innerHTML = html; ctx.classList.add("open"); const r = ctx.getBoundingClientRect(); ctx.style.left = Math.min(x, innerWidth - r.width - 8) + "px"; ctx.style.top = Math.min(y, innerHeight - r.height - 8) + "px"; }
function hideCtx() { ctx.classList.remove("open"); }
const item = (icon, label, k = "", cls = "") => `<button class="${cls}">${ic(icon)}${label}${k ? `<span class="kbd">${k}</span>` : ""}</button>`;
document.addEventListener("contextmenu", (e) => {
  if (e.target.closest("input, textarea")) return;
  e.preventDefault();
  const tr = e.target.closest("table.tasks tbody tr");
  if (tr) {
    state.selected = +tr.dataset.i; render();
    const t = tasks[state.selected]; const rec = t.s === "recording";
    showCtx(e.clientX, e.clientY, [
      rec ? item("stop", "停止录制") : item("play", "开始录制"),
      rec ? item("restart", "重新录制") : "",
      t.s === "paused" ? item("play", "恢复监控") : item("pause", "暂停监控"),
      "<hr>", item("edit", "编辑…"), item("folder", "打开文件夹"), item("copy", "复制直播间链接"),
      "<hr>", item("trash", "删除…", isMac() ? "⌘⌫" : "Del", "danger"),
    ].join(""));
    return;
  }
  if (e.target.closest(".lib tr[data-file]")) {
    showCtx(e.clientX, e.clientY, [item("play", "打开"), item("folder", "在文件夹中显示"), item("copy", "复制路径"), "<hr>", item("trash", "删除…", isMac() ? "⌘⌫" : "Del", "danger")].join(""));
    return;
  }
  if (e.target.closest(".selectable") && String(getSelection())) { showCtx(e.clientX, e.clientY, item("copy", "复制", kbd("C"))); return; }
  hideCtx();
});

// 快捷键：应用快捷键 + 屏蔽浏览器快捷键
document.addEventListener("keydown", (e) => {
  const mod = isMac() ? e.metaKey : e.ctrlKey;
  const k = e.key.toLowerCase();
  if (e.key === "Escape") { if (ctx.classList.contains("open")) hideCtx(); else if ($("#scrim").classList.contains("open")) closeDialog(); else if (state.page === "rooms" && state.selected >= 0) { state.selected = -1; render(); } return; }
  if (mod && k === "n") { e.preventDefault(); openDialog(); return; }
  if (mod && k === "f") { e.preventDefault(); if (state.page !== "rooms") { state.page = "rooms"; render(); } $("#search")?.focus(); return; }
  if (isMac() && e.metaKey && e.key === ",") { e.preventDefault(); state.page = "settings"; render(); return; }
  const blocked = e.key === "F5" || e.key === "F3" || e.key === "F7" || (mod && ["r", "p", "u", "s", "g", "j", "h", "=", "+", "-", "0"].includes(k)) || (e.altKey && (e.key === "ArrowLeft" || e.key === "ArrowRight"));
  if (blocked) e.preventDefault();
});
addEventListener("wheel", (e) => { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
addEventListener("dragstart", (e) => { if (!e.target.closest?.("[draggable=true]")) e.preventDefault(); });

// 悬停提示（含快捷键）
const tip = $("#tip"); let tipTimer;
document.addEventListener("mouseover", (e) => {
  const el = e.target.closest("[data-tip]"); clearTimeout(tipTimer); tip.classList.remove("open");
  if (!el) return;
  tipTimer = setTimeout(() => {
    const [label, key] = el.dataset.tip.split("|");
    tip.textContent = key ? (isMac() ? `${label} ${key === "Del" ? "⌘⌫" : key === "Esc" ? "⎋" : "⌘" + key}` : `${label}（${key === "Del" || key === "Esc" ? key : "Ctrl+" + key}）`) : label;
    const r = el.getBoundingClientRect(); tip.classList.add("open");
    const w = tip.offsetWidth; tip.style.left = Math.max(8, Math.min(r.left + r.width / 2 - w / 2, innerWidth - w - 8)) + "px"; tip.style.top = r.bottom + 6 + "px";
  }, 500);
});

render();
if (q.get("dialog") === "add") openDialog();
if (q.get("menu") === "1") setTimeout(() => {
  const tr = document.querySelector('table.tasks tbody tr[data-i="2"]'); const r = tr.getBoundingClientRect();
  tr.dispatchEvent(new MouseEvent("contextmenu", { bubbles: true, clientX: r.left + 260, clientY: r.top + 30 }));
}, 50);
</script>

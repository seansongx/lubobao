<!doctype html>
<!-- xiaofany.com 产品页封面，1600×1000（16:10）。由 capture.mjs 渲染，cover-source.png 和 app-icon.svg 会被替换成实际路径。
     小卡片裁成 4:3 时只保留中间 1333px 宽，标题和界面图都放在这个范围里。 -->
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <style>
      :root {
        --paper: #faf9f5;
        --paper-deep: #f1efe6;
        --ink: #141413;
        --ink-soft: #6b6a63;
        --line: #d9d6c9;
        --teal: #0f766e;
      }
      html,
      body {
        margin: 0;
        width: 1600px;
        height: 1000px;
        overflow: hidden;
      }
      body {
        position: relative;
        background:
          radial-gradient(ellipse 900px 520px at 50% 70%, rgba(15, 118, 110, 0.07), transparent 70%),
          linear-gradient(180deg, var(--paper) 0%, var(--paper-deep) 100%);
        font-family: "Segoe UI Variable Text", "Segoe UI", "Microsoft YaHei UI", "Microsoft YaHei", "PingFang SC", sans-serif;
        color: var(--ink);
      }
      header {
        position: absolute;
        top: 64px;
        left: 0;
        right: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
      }
      .name {
        display: flex;
        align-items: center;
        gap: 18px;
      }
      .name img {
        width: 64px;
        height: 64px;
        border-radius: 15px;
      }
      .name h1 {
        margin: 0;
        font-size: 56px;
        font-weight: 700;
        letter-spacing: 4px;
      }
      .slogan {
        margin: 0;
        font-size: 28px;
        color: var(--ink-soft);
        letter-spacing: 2px;
      }
      .slogan b {
        color: var(--teal);
        font-weight: 600;
      }
      .window {
        position: absolute;
        left: 50%;
        top: 262px;
        width: 1120px;
        height: 700px;
        transform: translateX(-50%);
        border-radius: 12px;
        border: 1px solid var(--line);
        overflow: hidden;
        background: #fff;
        box-shadow:
          0 1px 2px rgba(20, 20, 19, 0.06),
          0 24px 60px -12px rgba(20, 20, 19, 0.22);
      }
      .window img {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="name">
        <img src="app-icon.svg" alt="" />
        <h1>录播宝</h1>
      </div>
      <p class="slogan"><b>开播自动录</b>，不用再蹲直播</p>
    </header>
    <div class="window"><img src="cover-source.png" alt="" /></div>
  </body>
</html>

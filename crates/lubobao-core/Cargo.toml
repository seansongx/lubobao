[package]
name = "lubobao-core"
description = "录播宝核心：平台解析、录制、FFmpeg 组件、任务与调度（不依赖 Tauri）"
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true
publish = false

[features]
# 只在端到端测试中启用：把 `e2e+http://…` 链接当成正在直播的直播间。发布版不启用。
e2e = []

[dependencies]
dunce = "1"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
reqwest.workspace = true
sha2.workspace = true
flate2 = "1"
tar = "0.4"
rusqlite = { version = "0.43.0", features = ["bundled"] }
fs4.workspace = true
chrono.workspace = true
log.workspace = true
zip = { version = "9.8", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

# Linux：ffmpeg 的 PR_SET_PDEATHSIG；macOS：启动时清理上次崩溃留下的 ffmpeg（recorder::process_guard）。
[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
libc.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[package]
name = "lubobao"
version = "0.1.0"
description = "录播宝：开播自动录，不用再蹲直播"
authors = ["Song"]
license = "MIT"
repository = "https://github.com/xsong13/lubobao"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "lubobao_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "charset", "system-proxy", "socks"] }
sha2 = "0.10"
flate2 = "1"
tar = "0.4"
rusqlite = { version = "0.43.0", features = ["bundled"] }
tauri-plugin-dialog = "2"
fs4 = { version = "1.1.0", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[package]
name = "lubobao"
description = "录播宝：开播自动录，不用再蹲直播"
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "lubobao_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
lubobao-core.workspace = true
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"
# 日志写到应用日志目录（发布版的 Windows 没有控制台，macOS 从访达启动时 stderr 也不落盘）。
tauri-plugin-log = "2"
log.workspace = true
getrandom = "0.3"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"

# 主窗口的 Mica 和 WebView2 设置（desktop::window），版本与 Tauri 依赖的一致。
[target.'cfg(windows)'.dependencies]
window-vibrancy = "0.8"
webview2-com = "0.39"
windows-core = "0.62"

[target.'cfg(target_os = "linux")'.dependencies]
libc.workspace = true
# 桌面层监听 SIGTERM（注销、关机），与通用依赖的 tokio 合并特性。
tokio = { workspace = true, features = ["signal"] }

# 模拟运行时，测试 desktop::update 按顺序尝试多个升级接口（本地假服务器）。
[dev-dependencies]
tauri = { version = "2", features = ["tray-icon", "test"] }

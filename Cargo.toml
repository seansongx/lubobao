[workspace]
resolver = "3"
members = ["crates/lubobao-core", "crates/lubobao-cli", "src-tauri"]
# 在仓库根目录直接 `cargo build`、`cargo test` 时不构建桌面端，没有图形环境的服务器也能编译。
# 桌面端用 `npm run tauri dev/build`（在 src-tauri 里执行 cargo），或者 `-p lubobao`、`--workspace`。
default-members = ["crates/lubobao-core", "crates/lubobao-cli"]
# 会话的 worktree 在 .claude/worktrees/ 下，里面可能是旧布局（src-tauri 自成一个包）；
# 不排除的话，cargo 会向上找到这里，报「believes it's in a workspace when it's not」。
exclude = [".claude"]

[workspace.package]
version = "0.2.0"
authors = ["Song"]
license = "MIT"
repository = "https://github.com/seansongx/lubobao"
edition = "2024"

[workspace.dependencies]
lubobao-core = { path = "crates/lubobao-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
# gzip：平台接口的 JSON 和网页压缩后小一个数量级（抖音进房接口 736 KB → 51 KB），慢网下不压缩会超时。
# 只开纯 Rust 的 gzip（flate2/miniz_oxide），不开 zstd（要编译 C 库，影响 musl 静态构建）。
# 打开后所有 client 默认自动解压；逐字节校验的下载（FFmpeg、应用更新）要显式 `.no_gzip()`。
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "charset", "system-proxy", "socks", "gzip"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
fs4 = { version = "1.1.0", default-features = false }
libc = "0.2"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }
tempfile = "3"
sha2 = "0.10"
# 日志门面：核心只写 `log::warn!` 等，由桌面端（tauri-plugin-log，写日志文件）和命令行（stderr）
# 各自接收。
log = "0.4"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
#
# panic 用默认的 unwind，不设 "abort"：某个检测或录制任务（例如平台改版后解析到意外数据）
# panic 时只结束那个 tokio 任务或那次命令调用，其余录制继续；abort 会让整个进程连同所有
# 录制一起退出，macOS 上还会留下无人管理的 ffmpeg。各处的锁都处理了中毒（into_inner）。
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true

# 命令行程序的发布构建（`cargo build --profile release-cli -p lubobao-cli`）。现在与 release
# 相同，保留这个名字是因为 CI、发布流程和输出目录 `target/<triple>/release-cli/` 都用它。
[profile.release-cli]
inherits = "release"

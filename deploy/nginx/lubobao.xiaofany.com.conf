# 录播宝官网 lubobao.xiaofany.com 的 nginx 配置。
#
# 放进宿主机 nginx 的站点目录（例如 /etc/nginx/conf.d/ 或 sites-available/ + sites-enabled/），
# 这些目录在 http 块里被 include，所以下面的 map 可以直接写在这里。
# 部署前替换：
#   __SSL_CERTIFICATE__      证书链，例如 /etc/nginx/ssl/lubobao.xiaofany.com/fullchain.pem
#   __SSL_CERTIFICATE_KEY__  私钥，例如 /etc/nginx/ssl/lubobao.xiaofany.com/key.pem
#   __ACME_WEBROOT__         申请证书时 webroot 验证用的目录，例如 /var/www/acme
# 完整步骤见仓库 docs/website-deploy.md。

# 按路径决定缓存：HTML 和安装脚本每次都向服务器确认，其他静态资源缓存一段时间。
# 网站文件没有带哈希的文件名，所以 CSS、JS 只缓存 1 小时。
map $uri $lubobao_cache_control {
    default                                     "public, max-age=3600";
    /                                           "no-cache";
    /install.sh                                 "no-cache";
    /install-cli.sh                             "no-cache";
    ~*\.html$                                   "no-cache";
    ~*\.(?:svg|png|jpe?g|webp|avif|ico|woff2)$  "public, max-age=86400";
}

server {
    listen 80;
    listen [::]:80;
    server_name lubobao.xiaofany.com;

    # 申请、续期证书的 HTTP-01 验证
    location ^~ /.well-known/acme-challenge/ {
        root __ACME_WEBROOT__;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # nginx 1.25.1 以前没有 http2 指令，改成 listen 443 ssl http2;
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name lubobao.xiaofany.com;

    ssl_certificate     __SSL_CERTIFICATE__;
    ssl_certificate_key __SSL_CERTIFICATE_KEY__;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:lubobao_ssl:10m;
    ssl_session_timeout 1d;

    root /var/www/lubobao;
    index index.html;
    charset utf-8;
    charset_types text/plain text/css application/javascript image/svg+xml;
    server_tokens off;

    access_log /var/log/nginx/lubobao.access.log;
    error_log  /var/log/nginx/lubobao.error.log warn;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript image/svg+xml application/json;

    # 下面的 add_header 对所有 location 生效（location 里不能再写 add_header，否则这些会被覆盖）。
    add_header Cache-Control $lubobao_cache_control always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # 页面只加载本站资源；下载区通过 fetch 读取 xiaofany.com 的版本接口。
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://xiaofany.com; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;

    # 一键安装脚本：以纯文本返回，浏览器里直接打开也能看到内容
    location ~ ^/install(?:-cli)?\.sh$ {
        types { }
        default_type text/plain;    # 加上 charset 后为 text/plain; charset=utf-8
        try_files $uri =404;
    }

    # 隐藏文件（包括 rsync --delay-updates 的临时目录 .~tmp~）
    location ~ /\. {
        return 404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}

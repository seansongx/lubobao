name: Test

on:
  push:
  pull_request:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Build frontend
        run: |
          npm ci
          npm run build

      # 发布脚本的本地检查（GitHub 兜底更新清单 latest.json）。
      - name: Release script tests
        run: node --test scripts/updater-latest-json.test.mjs scripts/version-site-assets.test.mjs

      - name: Install test FFmpeg
        run: |
          dir="$RUNNER_TEMP/test-ffmpeg"
          mkdir -p "$dir"
          npm install --prefix "$dir" --no-audit --no-fund @seankit/ffmpeg@9.0.1
          ffmpeg="$(cd "$dir" && node -p "require('@seankit/ffmpeg').path")"
          "$ffmpeg" -hide_banner -version | head -n 1
          echo "LUBOBAO_TEST_FFMPEG=$ffmpeg" >> "$GITHUB_ENV"

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo clippy (e2e)
        run: cargo clippy -p lubobao-core -p lubobao-cli --all-targets --features lubobao-cli/e2e -- -D warnings

      - name: cargo test
        run: cargo test --workspace

      # 命令行端到端：本地样本流当直播间，run → add → 录制 → stop → 断流 → 退出信号。
      - name: CLI end-to-end test
        run: cargo test -p lubobao-cli --features e2e --test e2e -- --nocapture

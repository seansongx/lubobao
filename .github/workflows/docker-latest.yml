name: Docker latest

# 人工发布 GitHub Release 后，把已推送的 `<版本>` 镜像同时标为 `latest`。
# 只给已有的多架构索引加标签（buildx imagetools create），不重新构建；预发布不更新 latest。
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  tag-latest:
    name: tag latest
    if: ${{ !github.event.release.prerelease && startsWith(github.event.release.tag_name, 'v') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag latest
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          version="${TAG#v}"
          docker buildx imagetools inspect "$image:$version"
          docker buildx imagetools create --tag "$image:latest" "$image:$version"
          docker buildx imagetools inspect "$image:latest"
          echo "- \`$image:latest\` → \`$image:$version\`" >> "$GITHUB_STEP_SUMMARY"

name: Release

# 推送 v* 标签：三平台打包，并创建 GitHub Release 草稿（不会自动发布）。
# 手动触发：只打包，安装包保存在本次运行的 Actions 产物里。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
          - name: macos-x64
            os: macos-latest
            target: x86_64-apple-darwin
            bundles: app,dmg
          # 22.04 的 glibc 较旧，AppImage 和 deb 能在更多发行版上运行。
          - name: linux-amd64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
    runs-on: ${{ matrix.os }}
    # 更新签名私钥只放在 GitHub Environment「release」里，该环境的部署规则只允许 v* 标签。
    # 只有推送 v* 标签的构建进入这个环境、拿得到私钥；手动运行和 fork 不进入，一律不签。
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'release' || '' }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf libfuse2 file

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}

      - name: Check tag matches app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/check-version.mjs "$GITHUB_REF_NAME"

      # 草稿 Release 的「更新内容」直接取 docs/release-notes/<版本>.md（见 release job）。标签构建一开始
      # 就核对它存在且有内容，免得打包完才发现没写说明。
      - name: Check release notes
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          notes="docs/release-notes/${GITHUB_REF_NAME#v}.md"
          if [[ ! -f "$notes" ]] || ! grep -q '[^[:space:]]' "$notes"; then
            echo "::error::缺少更新说明 ${notes}：写好本版本的更新说明，和版本号一起提交，再重新打标签。"
            exit 1
          fi

      - run: npm ci

      # 应用内更新的签名，只在推送 v* 标签时进行：需要 release 环境里的签名私钥，以及 tauri.conf.json
      # 里的真实公钥，缺一样就失败（正式版必须能应用内更新）。其他构建（手动运行、fork）一律不签，
      # 关闭更新包并给出 warning。
      - name: Check updater signing
        id: signing
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          if [ "$IS_TAG" != "true" ]; then
            echo "::warning::不是 v* 标签的构建，不签名，不生成应用内更新包（.sig、.app.tar.gz）。"
            echo "updater=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          pubkey="$(node -p "require('./src-tauri/tauri.conf.json').plugins.updater.pubkey")"
          missing=""
          [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] || missing="release 环境的 Secret TAURI_SIGNING_PRIVATE_KEY"
          if [ -z "$pubkey" ] || [ "$pubkey" = "LUBOBAO_UPDATER_PUBKEY_NOT_SET" ]; then
            missing="${missing:+${missing}、}tauri.conf.json 的 plugins.updater.pubkey（仍是占位符）"
          fi
          if [ -n "$missing" ]; then
            echo "::error::正式版需要应用内更新签名，缺少：${missing}。见 docs/specs/release.md。"
            exit 1
          fi
          echo "updater=true" >> "$GITHUB_OUTPUT"

      # 不签名时用 --config 关掉更新包。参数用数组拼，不经 ${{ }} 展开（Windows 的 RUNNER_TEMP 带反斜杠）。
      - name: Build bundles
        env:
          UPDATER: ${{ steps.signing.outputs.updater }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ steps.signing.outputs.updater == 'true' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ steps.signing.outputs.updater == 'true' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        run: |
          args=(--ci --target "${{ matrix.target }}" --bundles "${{ matrix.bundles }}")
          if [ "$UPDATER" != "true" ]; then
            echo '{"bundle":{"createUpdaterArtifacts":false}}' > "$RUNNER_TEMP/no-updater.json"
            args+=(--config "$RUNNER_TEMP/no-updater.json")
          fi
          npx tauri build "${args[@]}"

      # 打包文件名改成 ASCII，便于放到下载站和 CDN。更新包和 .sig 一起改名：签名针对文件内容，
      # 改名不影响。每个 .sig 都用 tauri.conf.json 里的公钥校验一遍，私钥和公钥不是一对时失败。
      - name: Collect installers
        env:
          UPDATER: ${{ steps.signing.outputs.updater }}
        run: |
          version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          bundle="target/${{ matrix.target }}/release/bundle"
          out="$RUNNER_TEMP/installers"
          mkdir -p "$out"
          # 复制一个文件；生成了更新包时连同 .sig 一起复制（.sig 必须存在）。
          take() {
            cp "$1" "$out/$2"
            if [ "$UPDATER" = "true" ] && [ "${3:-}" = "signed" ]; then
              cp "$1.sig" "$out/$2.sig"
              node scripts/verify-updater-signature.mjs "$out/$2" --version "$version"
            fi
          }
          one() {
            set -- $1
            [ "$#" -eq 1 ] && [ -f "$1" ] || { echo "::error::应有且只有一个文件：$*" >&2; exit 1; }
            echo "$1"
          }
          case "${{ matrix.name }}" in
            windows-x64)
              take "$(one "$bundle/nsis/*-setup.exe")" "lubobao_${version}_windows_x64-setup.exe" signed ;;
            macos-arm64 | macos-x64)
              arch="${{ matrix.name }}"; arch="${arch#macos-}"
              take "$(one "$bundle/dmg/*.dmg")" "lubobao_${version}_macos_${arch}.dmg"
              if [ "$UPDATER" = "true" ]; then
                take "$(one "$bundle/macos/*.app.tar.gz")" "lubobao_${version}_macos_${arch}.app.tar.gz" signed
              fi ;;
            linux-amd64)
              take "$(one "$bundle/appimage/*.AppImage")" "lubobao_${version}_linux_amd64.AppImage" signed
              take "$(one "$bundle/deb/*.deb")" "lubobao_${version}_linux_amd64.deb" ;;
          esac
          ls -l "$out"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-${{ matrix.name }}
          path: ${{ runner.temp }}/installers/*
          if-no-files-found: error
          compression-level: 0

  # Linux 命令行和 Docker 镜像。等桌面端构建（含标签与版本号检查）通过后才开始，推送 v* 标签时
  # 把镜像以 `<版本>` 推送到 GHCR；`latest` 在人工发布 Release 后由 docker-latest.yml 加上。
  cli:
    needs: build
    uses: ./.github/workflows/cli.yml
    permissions:
      contents: read
      packages: write
    with:
      publish-image: ${{ startsWith(github.ref, 'refs/tags/v') }}

  publish:
    name: summary and draft release
    needs: [build, cli]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: installer-*
          path: installers
          merge-multiple: true

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cli-linux-*
          path: installers
          merge-multiple: true

      - name: Checksums and summary
        working-directory: installers
        run: |
          sha256sum lubobao_* lubobao-cli_* > SHA256SUMS.txt
          {
            echo "## 安装包"
            echo
            echo "| 文件 | 大小 | SHA-256 |"
            echo "| --- | ---: | --- |"
            for f in lubobao_* lubobao-cli_*; do
              size="$(stat -c %s "$f")"
              mib="$(awk "BEGIN { printf \"%.1f MiB\", $size / 1048576 }")"
              sum="$(sha256sum "$f" | cut -d ' ' -f 1)"
              echo "| \`$f\` | $mib ($size B) | \`$sum\` |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
          cat SHA256SUMS.txt

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # GitHub 兜底更新清单（tauri.conf.json 的第二个端点 releases/latest/download/latest.json）。只有签名的
      # v* 标签构建才有更新包和 .sig；缺任一平台的包或签名时失败。生成在 SHA256SUMS.txt 之后，不列入
      # 校验值：Release 发布后 publish-xiaofany.yml 会写入更新说明、改写这个文件。
      - name: Updater manifest (latest.json)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          node scripts/updater-latest-json.mjs --dir installers --tag "$GITHUB_REF_NAME"
          cat installers/latest.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installers-all
          path: installers/*
          compression-level: 0

      - name: Create draft release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        # 正文：「## 更新内容」+ docs/release-notes/<版本>.md + 分隔注释 + 安装说明。分隔注释以上的部分在
        # 发布时由 publish-xiaofany.yml 传到 xiaofany.com 并写进 latest.json；发布前仍可在草稿里修改。
        run: |
          version="${GITHUB_REF_NAME#v}"
          cat > install-notes.md <<'EOF'
          ## 下载

          | 系统 | 文件 |
          | --- | --- |
          | Windows 10/11（x64） | `*_windows_x64-setup.exe` |
          | macOS（推荐一键安装，自动选择芯片） | `curl -fsSL https://lubobao.xiaofany.com/install.sh \| sh` |
          | macOS（Apple 芯片） | `*_macos_arm64.dmg` |
          | macOS（Intel） | `*_macos_x64.dmg` |
          | Linux（x64） | `*_linux_amd64.AppImage` 或 `*_linux_amd64.deb` |
          | Linux 服务器命令行（x64 / arm64） | `lubobao-cli_*_linux_x64.tar.gz` / `lubobao-cli_*_linux_arm64.tar.gz` |
          | Docker（amd64 / arm64） | `ghcr.io/seansongx/lubobao:VERSION`（发布后同时为 `latest`） |

          首次启动时，录播宝会在后台下载 FFmpeg，安装包里不含 FFmpeg。校验值见 `SHA256SUMS.txt`。

          录播宝启动后会自动检查更新（可在 设置 → 关于 关闭），新版本校验签名后安装。`*.sig`、`*.app.tar.gz` 和 `latest.json` 是应用内更新用的文件，不需要手动下载。

          ## 首次打开提示

          安装包暂未做代码签名：

          - **Windows**：SmartScreen 提示“已保护你的电脑”时，点“更多信息”→“仍要运行”。
          - **macOS**：推荐在终端执行一键安装 `curl -fsSL https://lubobao.xiaofany.com/install.sh | sh`，它会下载对应芯片的版本、校验 SHA-256 后装进“应用程序”，不需要额外放行。手动下载 dmg 时：把录播宝拖进“应用程序”，先双击打开一次；macOS 15 及以上被拦下后，到“系统设置 → 隐私与安全性”底部点“仍要打开”（更早的系统可以在 Finder 里右键点应用 →“打开”）。如果提示“已损坏，无法打开”，在终端执行 `xattr -dr com.apple.quarantine /Applications/录播宝.app` 后再打开。
          - **Linux**：AppImage 需要先 `chmod +x`；deb 用 `sudo apt install ./文件名.deb` 安装。

          ## Linux 服务器（无界面命令行）

          `lubobao-cli` 是静态链接的单个可执行文件，不依赖图形界面，首次运行时自动下载 FFmpeg。自动下载的 FFmpeg 需要 glibc 2.28 及以上（Debian 10、Ubuntu 18.10、RHEL/Rocky 8 起）；Alpine、CentOS 7 等系统请装好系统的 ffmpeg，再用 `--ffmpeg` 或 `LUBOBAO_FFMPEG` 指定。

          ```sh
          tar -xzf lubobao-cli_VERSION_linux_x64.tar.gz
          sudo install -m 755 lubobao-cli_VERSION_linux_x64/lubobao-cli /usr/local/bin/
          lubobao-cli run                      # 前台常驻，监控并自动录制
          lubobao-cli add https://live.douyin.com/123456   # 另开终端添加直播间
          lubobao-cli list
          lubobao-cli stop 1                   # 停止录制
          ```

          Docker（内置 FFmpeg，停止时请留 45 秒收尾）：

          ```sh
          docker run -d --name lubobao --restart unless-stopped --stop-timeout 45 -v lubobao-data:/data -v lubobao-recordings:/recordings ghcr.io/seansongx/lubobao:VERSION
          docker exec lubobao lubobao-cli add https://live.douyin.com/123456
          docker stop -t 45 lubobao
          ```

          systemd 服务、compose 示例和全部子命令见 [docs/cli.md](https://github.com/seansongx/lubobao/blob/main/docs/cli.md)。国内拉取 GHCR 较慢时可使用镜像加速。
          EOF
          sed -i "s/VERSION/$version/g" install-notes.md
          {
            echo "## 更新内容"
            echo
            cat "docs/release-notes/$version.md"
            echo
            echo "<!-- 以上为应用内更新说明 -->"
            echo
            cat install-notes.md
          } > notes.md
          gh release create "$GITHUB_REF_NAME" installers/* \
            --draft \
            --title "录播宝 $GITHUB_REF_NAME" \
            --notes-file notes.md
